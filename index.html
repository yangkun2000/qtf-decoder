<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17324d">
  <title>QTF 文本二维码还原</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:#172331;background:#eef3f7}
    *{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:20px}
    header{background:#17324d;color:white;padding:24px 20px}header div{max-width:720px;margin:auto}
    h1{font-size:1.55rem;margin:0 0 6px}h2{font-size:1.15rem}.sub{opacity:.8;margin:0}
    .card{background:white;border-radius:14px;padding:18px;margin:16px 0;box-shadow:0 5px 20px #17324d14}
    .progress{height:12px;background:#dbe4eb;border-radius:99px;overflow:hidden}.bar{height:100%;width:0;background:#16856b}
    .status{font-weight:650;margin:12px 0 4px}.details{color:#526273;font-size:.92rem;overflow-wrap:anywhere}
    button,.file-label{display:inline-block;border:0;border-radius:9px;padding:11px 15px;margin:6px 4px 0 0;
      background:#176b87;color:white;font:inherit;font-weight:650;cursor:pointer}
    button.secondary,.file-label.secondary{background:#e3ebf0;color:#17324d}
    button.danger{background:#a33a3a}button:disabled{opacity:.45;cursor:default}
    input[type=file]{display:none}video{display:none;width:100%;border-radius:10px;margin-top:12px;background:#111}
    textarea{width:100%;min-height:220px;border:1px solid #c9d4dc;border-radius:9px;padding:12px;font:14px ui-monospace,monospace}
    .notice{font-size:.88rem;color:#526273;line-height:1.55}.error{color:#a11f2f}.ok{color:#08715b}
  </style>
</head>
<body>
  <header><div><h1>QTF 文本二维码还原</h1><p class="sub">分片仅在本机浏览器中处理，不上传文件内容</p></div></header>
  <main class="wrap">
    <section class="card">
      <h2>扫描进度</h2>
      <div class="progress"><div id="bar" class="bar"></div></div>
      <div id="status" class="status">等待扫描 QTF1 分片</div>
      <div id="details" class="details">请使用手机系统相机扫描第一个二维码。</div>
      <button id="camera">连续扫码</button>
      <label class="file-label secondary" for="image">识别二维码图片</label>
      <input id="image" type="file" accept="image/*" capture="environment">
      <button id="clear" class="danger">清除此文件进度</button>
      <video id="video" playsinline muted></video>
      <p class="notice">“连续扫码”和图片识别依赖浏览器 BarcodeDetector 支持。若按钮不可用，使用系统相机逐个扫描即可；每次打开本页都会自动累计分片。</p>
    </section>
    <section id="resultCard" class="card" hidden>
      <h2>还原结果</h2>
      <textarea id="result" readonly></textarea>
      <button id="copy">复制文本</button>
      <button id="download" class="secondary">下载原文件</button>
    </section>
  </main>
  <script>
  "use strict";
  const $ = id => document.getElementById(id);
  let currentId = "";
  let restoredBytes = null;
  let restoredName = "restored.txt";
  let stream = null;
  let scanning = false;

  function fromB64url(value) {
    const padded = value.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4-value.length%4)%4);
    const binary = atob(padded), out = new Uint8Array(binary.length);
    for (let i=0;i<binary.length;i++) out[i]=binary.charCodeAt(i);
    return out;
  }
  function textFromB64url(value) {
    return new TextDecoder("utf-8",{fatal:true}).decode(fromB64url(value));
  }
  function parsePayload(raw) {
    let hash = raw;
    try { hash = new URL(raw).hash; } catch (_) {}
    if (hash.startsWith("#")) hash=hash.slice(1);
    const parts=hash.split("/");
    if (parts.length!==8 || parts[0]!=="QTF1") throw new Error("这不是有效的 QTF1 分片。");
    const [,id,indexText,totalText,digest,sizeText,name64,chunk]=parts;
    const index=Number(indexText), total=Number(totalText), size=Number(sizeText);
    if (!/^[0-9a-f]{16}$/.test(id) || !/^[0-9a-f]{64}$/.test(digest) ||
        !Number.isInteger(index) || !Number.isInteger(total) || index<1 || index>total ||
        total>9999 || !Number.isInteger(size) || size<0 || size>1048576 ||
        !/^[A-Za-z0-9_-]+$/.test(chunk)) throw new Error("分片字段无效或已损坏。");
    return {id,index,total,digest,size,name:textFromB64url(name64),chunk};
  }
  function load(id) {
    try { return JSON.parse(localStorage.getItem("qtf1:"+id)); } catch (_) { return null; }
  }
  function save(part) {
    let state=load(part.id);
    if (!state) state={id:part.id,total:part.total,digest:part.digest,size:part.size,name:part.name,chunks:{}};
    if (state.total!==part.total || state.digest!==part.digest || state.size!==part.size)
      throw new Error("该分片与当前同标识文件不一致。");
    state.chunks[part.index]=part.chunk;
    localStorage.setItem("qtf1:"+part.id,JSON.stringify(state));
    currentId=part.id;
    return state;
  }
  async function sha256Hex(bytes) {
    const digest=await crypto.subtle.digest("SHA-256",bytes);
    return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  async function inflate(bytes) {
    if (!("DecompressionStream" in window)) throw new Error("此浏览器不支持解压，请升级浏览器后重试。");
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function render(state,message="") {
    const count=Object.keys(state.chunks).length;
    $("bar").style.width=(count/state.total*100)+"%";
    $("status").textContent=message || `已收集 ${count} / ${state.total} 个分片`;
    $("status").className="status";
    $("details").textContent=`文件：${state.name}　原始大小：${state.size} 字节　标识：${state.id}`;
  }
  async function finish(state) {
    if (Object.keys(state.chunks).length!==state.total) return;
    $("status").textContent="分片齐全，正在解压和校验...";
    let encoded="";
    for(let i=1;i<=state.total;i++) {
      if (!state.chunks[i]) return;
      encoded+=state.chunks[i];
    }
    const bytes=await inflate(fromB64url(encoded));
    if (bytes.length!==state.size || await sha256Hex(bytes)!==state.digest)
      throw new Error("完整性校验失败，分片可能损坏。");
    const text=new TextDecoder("utf-8",{fatal:true}).decode(bytes);
    restoredBytes=bytes; restoredName=state.name || "restored.txt";
    $("result").value=text; $("resultCard").hidden=false;
    $("status").textContent="还原完成，SHA-256 校验通过";
    $("status").className="status ok";
  }
  async function accept(raw) {
    try {
      const part=parsePayload(raw), state=save(part);
      render(state,`已接收第 ${part.index} 个分片，共 ${state.total} 个`);
      history.replaceState(null,"",location.pathname+location.search);
      await finish(state);
      if (navigator.vibrate) navigator.vibrate(80);
    } catch (e) {
      $("status").textContent=e.message;
      $("status").className="status error";
    }
  }
  async function startCamera() {
    if (!("BarcodeDetector" in window)) {
      $("status").textContent="此浏览器不支持连续扫码，请使用系统相机。";
      $("status").className="status error"; return;
    }
    if (scanning) { stopCamera(); return; }
    try {
      const detector=new BarcodeDetector({formats:["qr_code"]});
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
      $("video").srcObject=stream; $("video").style.display="block"; await $("video").play();
      scanning=true; $("camera").textContent="停止连续扫码";
      let last="",lastTime=0;
      const loop=async()=>{
        if(!scanning)return;
        try {
          const codes=await detector.detect($("video"));
          const now=Date.now();
          for(const code of codes) if(code.rawValue && (code.rawValue!==last || now-lastTime>1800)){
            last=code.rawValue;lastTime=now;await accept(code.rawValue);
          }
        } catch(_){}
        requestAnimationFrame(loop);
      }; loop();
    } catch(e) {
      $("status").textContent="无法启动相机："+e.message;
      $("status").className="status error";
    }
  }
  function stopCamera(){
    scanning=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;
    $("video").style.display="none";$("camera").textContent="连续扫码";
  }
  $("camera").onclick=startCamera;
  $("image").onchange=async event=>{
    if(!("BarcodeDetector" in window)){alert("此浏览器不支持图片识别。");return}
    try{
      const bitmap=await createImageBitmap(event.target.files[0]);
      const codes=await new BarcodeDetector({formats:["qr_code"]}).detect(bitmap);
      if(!codes.length)throw new Error("图片中未识别到二维码");
      await accept(codes[0].rawValue);
    }catch(e){$("status").textContent=e.message;$("status").className="status error"}
    event.target.value="";
  };
  $("clear").onclick=()=>{
    if(!currentId){$("status").textContent="当前没有可清除的文件进度。";return}
    if(confirm("确定清除此文件的全部已扫描分片吗？")){
      localStorage.removeItem("qtf1:"+currentId);currentId="";restoredBytes=null;
      $("bar").style.width="0";$("status").textContent="已清除，等待重新扫描";
      $("details").textContent="请使用手机系统相机扫描第一个二维码。";$("resultCard").hidden=true;
    }
  };
  $("copy").onclick=async()=>{await navigator.clipboard.writeText($("result").value);$("copy").textContent="已复制"};
  $("download").onclick=()=>{
    if(!restoredBytes)return;
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([restoredBytes],{type:"text/plain;charset=utf-8"}));
    a.download=restoredName;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  addEventListener("pagehide",stopCamera);
  if(location.hash) accept(location.href);
  </script>
</body>
</html>
